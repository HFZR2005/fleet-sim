# The fleet in the loop at one point: 1 million batteries nationally, half
# the homes on each transformer with a battery, against M = 0 on the same
# fleets. Same topology, days and battery catalogue as network-sweep.toml.
# market-sweep.toml sweeps M, local penetration and rho.

n_homes = 50
penetration = 0.5
mode = "diverse"
region = "C"
start = 2026-01-05
end = 2026-01-11
seed = 1
replications = 10

[market]
national_batteries = [0, 1000000]
price_model = "fuel_adjusted/exponential"

[network]
n_transformers = 4
rho = 0.0
admd_kw = 2.0
headroom = 1.0
power_factor = 0.95
ratings_kva = [25.0, 50.0, 100.0]

[battery]
soc_initial = 0.5

[[battery.products]]
capacity_kwh = 5.0
power_kw = [3.6]
weight = 1.0

[[battery.products]]
capacity_kwh = 10.0
power_kw = [3.6, 5.0]
weight = 1.0

[[battery.products]]
capacity_kwh = 13.5
power_kw = [5.0]
weight = 1.0

[battery.efficiency]
mean = 0.95
standard_deviation = 0.01
low = 0.92
high = 0.97
