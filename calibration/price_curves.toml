[data]
start = 2021-05-01
end = 2025-12-31
cache_dir = ".cache/prices"
agile_regions = ["C"]

[fuel_cost]
heat_rate = 2.0
gas_carbon_intensity = 0.184
include_carbon_price_support = true

[splits]
training_years = [2021, 2022, 2023, 2024]
final_test_year = 2025

[models]
families = ["cubic", "signed_quadratic", "cubic_offset", "exponential", "isotonic"]
targets = ["raw_pooled", "raw_per_year", "fuel_adjusted"]

[evaluation]
weight_by_fleet_schedule = "identical"

[chosen]
main = ""
robustness = ""

[output]
results_dir = "results/price-curves"
parameters_file = "calibration/price_curves.json"
